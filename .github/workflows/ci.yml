# Every pull request and every push to master: typechecked, tested and built.
#
#   gh workflow run ci.yml --ref <branch>    run it on any other ref, by hand
#   gh pr checks --watch                     follow a pull request's
#
# This is the sample client the factory's end-to-end checks run against, so
# its shape is the one the factory expects of a client: one required check,
# ci-ok, and a deploy that waits on it.

name: CI

on:
  pull_request:
    branches: [master]
  # deploy.yml's staging job runs after this workflow succeeds on a push to
  # master, so every merge needs its own run here.
  push:
    branches: [master]
  workflow_dispatch:

# A newer push to a pull request makes the older run moot. Every other run
# gets a group of its own: GitHub keeps only one pending run per group, so a
# shared group on master would cancel the middle of three quick merges, and
# that merge's deploy would never start.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # As .nvmrc and package.json's engines.
  NODE_VERSION: "24"

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm's version comes from package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The one name branch protection requires and the deploy waits on. It runs
  # whatever happened above, so a failure is a red job here, not a skipped one.
  ci-ok:
    if: ${{ !cancelled() }}
    needs: [typescript]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "typescript: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
